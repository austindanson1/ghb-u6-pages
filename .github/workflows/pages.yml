name: U6 pages build probe
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: probe 13 (did write survive)
        run: |
          set -o pipefail
          python3 probe13.py 2>&1 | tee probe-13.txt

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
